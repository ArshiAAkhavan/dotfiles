<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Vazirmatn</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Vazirmatn</family>
  </prefer>
 </alias>
 <alias>
  <family>system-ui</family>
  <prefer>
   <family>Vazirmatn</family>
  </prefer>
 </alias>
    <match target="font">
        <edit name="rgba" mode="assign">
        <const>none</const>
    </edit>
  </match>
</fontconfig>

