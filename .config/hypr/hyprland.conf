exec = kvantummanager --set Nordic
exec = gsettings set org.gnome.desktop.interface icon-theme 'Nordic-icon'
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Nordic-Theme'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(5e81accc) rgba(73b580cc) 45deg
    col.inactive_border = rgba(b16286cc) rgba(ebcb8bcc) 45deg
    layout = dwindle
    resize_on_border = true

    # border_size = 3
    # col.active_border = $mauve $flamingo 90deg
    # col.inactive_border = $subtext0
    # resize_on_border = true

    # gaps_in = 4
    # gaps_out = 8
    # layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

group {
    col.border_active = rgba(5e81accc) rgba(73b580cc) 45deg
    col.border_inactive = rgba(b16286cc) rgba(ebcb8bcc) 45deg
    col.border_locked_active = rgba(5e81accc) rgba(73b580cc) 45deg
    col.border_locked_inactive = rgba(b16286cc) rgba(ebcb8bcc) 45deg
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }


    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = true
        vibrancy = 0.1696
    }


}

