# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout  = us,ir
    kb_variant =
    kb_model   =
    kb_options = grp:win_space_toggle,caps:escape
    kb_rules   =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.2
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
}


# ▒█░░░ █▀▀█ ▒█░░▒█ █▀▀█ █░░█ ▀▀█▀▀ 
# ▒█░░░ █▄▄█ ▒█▄▄▄█ █░░█ █░░█ ░░█░░ 
# ▒█▄▄█ ▀░░▀ ░░▒█░░ ▀▀▀▀ ░▀▀▀ ░░▀░░░


dwindle {
    pseudotile = yes # master switch for pseudotiling, enable with mainMod + P
    preserve_split = yes
}

master {
    new_status = master
}


# ░█▀▄▀█ ▀█▀ █▀▀ █▀▀ 
# ░█░█░█ ░█─ ▀▀█ █── 
# ░█──░█ ▄█▄ ▀▀▀ ▀▀▀


misc {
    vrr = 0
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


# ▒█░▄▀ █▀▀ ▒█░░▒█ █▀▄▀█ █▀▀█ █▀▀█ 
# ▒█▀▄░ █▀▀ ▒█▄▄▄█ █░▀░█ █▄▄█ █░░█ 
# ▒█░▒█ ▀▀▀ ░░▒█░░ ▀░░░▀ ▀░░▀ █▀▀▀


# See https://wiki.hyprland.org/Configuring/Keywords/
# $mainMod = SUPER # Sets "Windows" key as main modifier
$mainMod = ALT # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = SUPER, E, exec, nautilus 
bind = $mainMod, M, exec, ~/.config/eww/scripts/eww-toggle.sh control-center
bind = $mainMod, W, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, B, togglesplit, # dwindle
bind = $mainMod, G, togglegroup, # dwindle
# clipboard menu
bind = $mainMod, V, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy

# language change sway-osd
bind = SUPER, space, exec, swayosd-client --custom-message=`hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap'`

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

binde = $mainMod SHIFT, right, resizeactive, 10 0
binde = $mainMod SHIFT, left, resizeactive, -10 0
binde = $mainMod SHIFT, up, resizeactive, 0 -10
binde = $mainMod SHIFT, down, resizeactive, 0 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, L, workspace, e+1
bind = $mainMod SHIFT, H, workspace, e-1

bind = $mainMod CTRL SHIFT, L, movetoworkspace, r+1
bind = $mainMod CTRL SHIFT, H, movetoworkspace, r-1

# focus 
bind = $mainMod, F, fullscreen

# screen shots
bind = SHIFT,PRINT, exec, hyprshot -m window | wl-copy 
bind = ,PRINT, exec, hyprshot -m region | wl-copy 

# screen lock
bind = SUPER, l, exec, hyprlock

# browser 
bind = SUPER, 3, exec, zen

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
# bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
# bind = , XF86AudioMut, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
