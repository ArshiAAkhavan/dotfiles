# TODO: fix language toggle
## 1: xkb doesn't support grp_win_space_toggle alongside half-space
## 2: this trick works in terminal but not in hyprland.conf
# $xkb_toggle = hyprctl switchxkblayout thinkpad-extra-buttons next
# bind = SUPER, space, exec, $xkb_toggle && swayosd-client --custom-message=`hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap'`
## 3: had to resort to right_alt toggle and no sway-osd
input {
    kb_layout  = us,ir
    kb_model   = 
    kb_variant = 
    kb_options = caps:escape, grp:toggle
    kb_rules   =

    follow_mouse = 1
    special_fallthrough = true

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.2
}


binds {
    # focus_window_on_workspace_c# For Auto-run stuff see execs.confhange = true
    scroll_event_delay = 0
}

# in your input / gesture section, not inside old gestures {} block
gesture = 3, horizontal, workspace
# gesture = 3, left, workspace, r+1
# gesture = 3, right, workspace, r-1

# gesture{
# workspace_swipe_create_new = true
# workspace_swipe_distance = 700
# workspace_swipe_cancel_ratio = 0.2
# workspace_swipe_min_speed_to_force = 5

# }

general {
    # Gaps and border
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50
    border_size = 2
    
    # Fallback colors
    # col.active_border = rgba(0DB7D4FF)
    # col.inactive_border = rgba(31313600)

    col.active_border = rgba(5e81accc) rgba(73b580cc) 45deg
    col.inactive_border = rgba(b16286cc) rgba(ebcb8bcc) 45deg
    layout = dwindle
    resize_on_border = true

    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle
    
    #focus_to_other_workspaces = true # ahhhh i still haven't properly implemented this
    allow_tearing = true # This just allows the `immediate` window rule to work
}

group {
    col.border_active = rgba(5e81accc) rgba(73b580cc) 45deg
    col.border_inactive = rgba(b16286cc) rgba(ebcb8bcc) 45deg
    col.border_locked_active = rgba(5e81accc) rgba(73b580cc) 45deg
    col.border_locked_inactive = rgba(b16286cc) rgba(ebcb8bcc) 45deg
}

dwindle {
  pseudotile = yes # master switch for pseudotiling, enable with mainMod + P
  preserve_split = yes
	smart_split = false
	smart_resizing = false
}

master {
    new_status = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }


    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        # xray = true
        vibrancy = 0.1696
    }


}

animations {
    enabled = true
    # Animation curves
    
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration
    # Animation configs
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    # animation = layers, 1, 2, md3_decel, slide
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 0.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    # animation = workspaces, 1, 2.5, softAcDecel, slide
    # animation = workspaces, 1, 7, menu_decel, slidefade 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

